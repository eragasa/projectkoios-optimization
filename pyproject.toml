[build-system]
requires = []
build-backend = "backend"
backend-path = ["build_backend"]

[project]
name = "projectkoios-optimization"
version = "0.1.0.dev0"
description = "Numerics and optimization for Project Koios"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]
dependencies = []

[project.urls]
Repository = "https://github.com/eragasa/projectkoios-optimization"
Documentation = "https://github.com/eragasa/projectkoios-optimization/tree/main/docs"

[project.optional-dependencies]
numpy = [
    "numpy>=2.3,<3",
]
scipy = [
    "numpy>=2.3,<3",
    "scipy>=1.18,<2",
]
gmm = [
    "numpy>=2.3,<3",
    "scipy>=1.18,<2",
    "scikit-learn>=1.8,<2",
]
benchmark = [
    "matplotlib>=3.11,<4",
    "numpy>=2.3,<3",
    "pymoo==0.6.2",
    "scikit-learn==1.8.0",
    "scipy>=1.18,<2",
]
development = [
    "build>=1.3,<2",
    "mpmath>=1.3,<2",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: dependency-free contract and behavior verification",
    "integration: optional third-party integration verification",
    "numerical: bounded numerical verification without scientific-validation claims",
    "property: deterministic generated-case software verification",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["projectkoios", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = [
    "src/python/projectkoios/numerics",
    "src/python/projectkoios/optimization",
    "tests/projectkoios/numerics/linalg",
    "tests/projectkoios/numerics/numpy",
    "tests/projectkoios/numerics/scipy",
    "tests/projectkoios/optimization/quadratic/box",
    "tests/projectkoios/optimization/quadratic/numpy/box",
    "tests/projectkoios/optimization/selection",
]
mypy_path = "src/python"

[[tool.mypy.overrides]]
module = [
    "mpmath",
    "mpmath.*",
    "numpy",
    "numpy.*",
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true
